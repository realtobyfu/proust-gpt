name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Frontend: type-check + build ───────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ─── Backend: pytest with mocked services ───────────────────
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      - run: pytest -v

  # ─── Docker: build + smoke-test health endpoint ─────────────
  docker-build:
    needs: [frontend, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proustgpt-test .
      - name: Smoke-test container
        run: |
          docker run -d --name proustgpt-smoke -p 8000:8000 \
            -e SERVE_STATIC=true -e PORT=8000 \
            proustgpt-test
          # Wait for the container to start
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done
          # Verify health returns 200
          curl -sf http://localhost:8000/health
          docker stop proustgpt-smoke

  # ─── Deploy to Render (main only) ──────────────────────────
  deploy:
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -sf "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "Deploy hook not configured (skipping)"
