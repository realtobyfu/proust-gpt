services:
  proustgpt:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - SERVE_STATIC=true
      - STATIC_DIR=./static
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
